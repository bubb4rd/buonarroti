<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="light dark" />
    <title>Buonarroti</title>
    <style>
      :root {
        --paper: #f5f2eb;
        --ink: #1e1c19;
        --ink-3: #8a8478;
        --rule: rgba(30, 28, 25, 0.1);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --paper: #161513;
          --ink: #ede8dd;
          --ink-3: #807a6f;
          --rule: rgba(237, 232, 221, 0.1);
        }
      }
      html, body {
        margin: 0;
        height: 100%;
        background: var(--paper);
        color: var(--ink-3);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        -webkit-user-select: none;
        user-select: none;
        cursor: default;
      }
      .drag {
        position: fixed;
        inset: 0 0 auto 0;
        height: 28px;
        -webkit-app-region: drag;
      }
      .wrap {
        height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
      }
      .mark {
        width: 56px;
        height: 56px;
        color: var(--ink);
        animation: breathe 3.6s ease-in-out infinite;
      }
      .name {
        font-family: "Iowan Old Style", Palatino, Georgia, serif;
        font-size: 26px;
        letter-spacing: 0.01em;
        color: var(--ink);
      }
      .line {
        position: relative;
        width: 120px;
        height: 1px;
        background: var(--rule);
        overflow: hidden;
      }
      .line::after {
        content: "";
        position: absolute;
        inset: 0 auto 0 0;
        width: 40%;
        background: var(--ink-3);
        animation: travel 2.4s ease-in-out infinite;
      }
      @keyframes breathe {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.55; }
      }
      @keyframes travel {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(250%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .mark, .line::after { animation: none; }
        .line::after { width: 100%; opacity: 0.4; }
      }
    </style>
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>
    <div class="wrap" role="status" aria-label="Starting Buonarroti">
      <svg class="mark" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3.4" aria-hidden="true">
        <circle cx="32" cy="23" r="13" />
        <circle cx="23" cy="39" r="13" />
        <circle cx="41" cy="39" r="13" />
      </svg>
      <div class="name">Buonarroti</div>
      <div class="line"></div>
    </div>
  </body>
</html>
